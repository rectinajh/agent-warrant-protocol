<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Warrant Protocol</title>
    <style>
      :root {
        --bg: #06080f;
        --panel: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.1);
        --text: #eef1f7;
        --muted: #8b94a7;
        --blue: #4da3ff;
        --violet: #8b5cf6;
        --teal: #2dd4bf;
        --ok: #35c98a;
        --warn: #f0b45b;
        --danger: #ef5b6b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-x: hidden;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.55;
        animation: float 18s ease-in-out infinite;
      }
      .b1 {
        width: 420px;
        height: 420px;
        left: -80px;
        top: -100px;
        background: radial-gradient(circle, #2b4bff, transparent 70%);
      }
      .b2 {
        width: 460px;
        height: 460px;
        right: -120px;
        top: 20%;
        background: radial-gradient(circle, #8b5cf6, transparent 70%);
        animation-delay: -6s;
      }
      .b3 {
        width: 380px;
        height: 380px;
        left: 28%;
        bottom: -160px;
        background: radial-gradient(circle, #0ea5a5, transparent 70%);
        animation-delay: -12s;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(40px, 30px) scale(1.08);
        }
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 75%);
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      header {
        text-align: center;
        margin-bottom: 36px;
      }
      .logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        font-size: 30px;
        color: #fff;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--blue), var(--violet));
        box-shadow: 0 0 40px rgba(77, 163, 255, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #fff, #9ecbff 60%, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        color: var(--muted);
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.12em;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        transition: color 0.3s;
      }
      .step .num {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        border: 1px solid var(--line);
        background: var(--panel);
        transition: all 0.3s;
      }
      .step.active {
        color: #fff;
      }
      .step.active .num {
        background: linear-gradient(135deg, var(--blue), var(--violet));
        border-color: transparent;
        box-shadow: 0 0 18px rgba(77, 163, 255, 0.6);
      }
      .step.done .num {
        background: rgba(53, 201, 138, 0.18);
        border-color: rgba(53, 201, 138, 0.4);
        color: var(--ok);
      }
      .stepper .line {
        width: 46px;
        height: 1px;
        background: var(--line);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        margin-bottom: 18px;
        backdrop-filter: blur(18px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        animation: rise 0.45s ease both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      h2 {
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 600;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        background: rgba(0, 0, 0, 0.28);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 15px;
        font: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      textarea:focus {
        outline: none;
        border-color: rgba(77, 163, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.15);
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        border: 0;
        cursor: pointer;
        border-radius: 11px;
        padding: 11px 20px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, var(--blue), var(--violet));
        box-shadow: 0 6px 22px rgba(77, 163, 255, 0.35);
        transition:
          transform 0.15s,
          box-shadow 0.2s,
          filter 0.2s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 14px;
        align-items: center;
      }
      .record {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.22);
      }
      .record .rl {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .record .rv {
        font-size: 30px;
        font-weight: 700;
        margin: 6px 0 2px;
        font-variant-numeric: tabular-nums;
      }
      .record.target .rv {
        color: var(--teal);
      }
      .record .rm {
        color: var(--muted);
        font-size: 12.5px;
      }
      .arrow {
        font-size: 26px;
        color: var(--blue);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateX(0);
        }
        50% {
          opacity: 1;
          transform: translateX(4px);
        }
      }
      .reason {
        margin-top: 14px;
        padding: 13px 15px;
        border-radius: 12px;
        background: rgba(77, 163, 255, 0.08);
        border: 1px solid rgba(77, 163, 255, 0.2);
        color: #d8e6ff;
        font-size: 14px;
      }
      .reason b {
        color: var(--blue);
      }
      a {
        color: var(--blue);
        word-break: break-all;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .pill.ok {
        background: rgba(53, 201, 138, 0.14);
        color: var(--ok);
      }
      .pill.warn {
        background: rgba(240, 180, 91, 0.14);
        color: var(--warn);
      }
      .pill.err {
        background: rgba(239, 91, 107, 0.14);
        color: var(--danger);
      }
      .statechain {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .snode {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
        color: var(--muted);
        background: rgba(0, 0, 0, 0.18);
      }
      .snode.done {
        border-color: rgba(53, 201, 138, 0.35);
        color: var(--ok);
      }
      .snode.active {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(135deg, var(--blue), var(--violet));
        box-shadow: 0 0 20px rgba(77, 163, 255, 0.55);
      }
      .snode.bad {
        border-color: rgba(239, 91, 107, 0.4);
        color: var(--danger);
      }
      .sarrow {
        color: var(--muted);
        opacity: 0.6;
      }
      .timeline {
        position: relative;
        padding-left: 22px;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: linear-gradient(var(--violet), var(--blue));
        opacity: 0.5;
      }
      .tnode {
        position: relative;
        padding: 0 0 20px;
      }
      .tnode:last-child {
        padding-bottom: 0;
      }
      .tnode::before {
        content: "";
        position: absolute;
        left: -21px;
        top: 5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 10px rgba(77, 163, 255, 0.8);
      }
      .tevent {
        font-weight: 600;
        font-size: 14px;
      }
      .tmeta {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 3px;
      }
      .thash {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: var(--muted);
        opacity: 0.8;
        word-break: break-all;
      }
      pre {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        overflow: auto;
        font:
          12.5px/1.55 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--blue);
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 26px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
      }
      @media (max-width: 640px) {
        .compare {
          grid-template-columns: 1fr;
        }
        .arrow {
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="grid"></div>
    </div>

    <div class="wrap">
      <header>
        <div class="logo">◈</div>
        <h1>Agent Warrant Protocol</h1>
        <p class="tagline">AI 提出 · 人类授权 · 系统执行 · 全程留痕</p>
      </header>

      <div class="stepper">
        <div class="step active" id="step1"><span class="num">1</span>提案</div>
        <div class="line"></div>
        <div class="step" id="step2"><span class="num">2</span>签名</div>
        <div class="line"></div>
        <div class="step" id="step3"><span class="num">3</span>执行</div>
      </div>

      <div class="card">
        <label for="request">告诉 AI 要执行什么高风险操作</label>
        <textarea
          id="request"
          placeholder="例如：把 status 记录切到应急事故页面"
        ></textarea>
        <div class="row">
          <button id="propose">生成提案</button>
          <span id="proposeSpin" class="spinner" hidden></span>
        </div>
      </div>

      <div class="card" id="proposal" hidden>
        <h2>提案</h2>
        <div class="compare">
          <div class="record">
            <div class="rl">当前记录</div>
            <div class="rv" id="beforeVal">—</div>
            <div class="rm" id="beforeMeta"></div>
          </div>
          <div class="arrow">→</div>
          <div class="record target">
            <div class="rl">目标记录</div>
            <div class="rv" id="afterVal">—</div>
            <div class="rm" id="afterMeta"></div>
          </div>
        </div>
        <div class="reason" id="reason"></div>
        <div class="row">
          <button id="issue">签发 warrant</button>
          <span id="issueSpin" class="spinner" hidden></span>
        </div>
      </div>

      <div class="card" id="signing" hidden>
        <h2>等待签名</h2>
        <p style="margin-top: 0; color: var(--muted)">
          打开下方链接完成 Foxit 签名，签完后执行按钮会自动解锁。
        </p>
        <p><a id="signingLink" target="_blank" rel="noopener"></a></p>
        <div style="margin-top: 12px">
          <span id="signingStatus" class="pill warn">等待签名…</span>
        </div>
      </div>

      <div class="card" id="chain" hidden>
        <h2>Warrant 生命周期</h2>
        <div class="statechain" id="statechain"></div>
      </div>

      <div class="card" id="result" hidden>
        <h2>执行回执</h2>
        <pre id="resultBody"></pre>
        <div class="row">
          <button class="ghost" id="download">下载回执 JSON</button>
          <button class="ghost" id="replay">再次执行（应被拒绝）</button>
        </div>
        <div id="replayResult" style="margin-top: 12px"></div>
      </div>

      <div class="card" id="audit" hidden>
        <h2>审计链</h2>
        <div class="timeline" id="auditTimeline"></div>
      </div>

      <footer>
        <span class="dot"></span>
        当前 DNS：<span id="dnsStatus">加载中…</span>
      </footer>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const S = { warrantId: null, envelopeId: null };
      let lastResult = null;

      async function post(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      }

      function setBusy(btn, spin, on) {
        btn.disabled = on;
        spin.hidden = !on;
      }

      const STATES = [
        "DRAFT",
        "PENDING_SIGNATURE",
        "AUTHORIZED",
        "EXECUTING",
        "EXECUTED",
      ];
      const BAD = ["FAILED", "DECLINED", "EXPIRED", "CANCELLED"];

      function renderChain(state) {
        $("chain").hidden = false;
        const idx = STATES.indexOf(state);
        const bad = BAD.includes(state);
        const nodes = STATES.map((s, i) => {
          const cls = i < idx ? "done" : i === idx ? "active" : "";
          return `<span class="snode ${cls}">${s}</span>`;
        });
        let html = nodes.join('<span class="sarrow">→</span>');
        if (bad)
          html += `<span class="sarrow">→</span><span class="snode bad">${state}</span>`;
        $("statechain").innerHTML = html;
      }

      function renderAudit(audit) {
        if (!audit.length) return;
        $("audit").hidden = false;
        $("auditTimeline").innerHTML = audit
          .map(
            (e) => `
            <div class="tnode">
              <div class="tevent">${e.event_type}</div>
              <div class="tmeta">${e.before_state ?? "·"} → ${e.after_state ?? "·"} · actor ${e.actor_id}</div>
              <div class="thash">${e.event_hash}</div>
            </div>`,
          )
          .join("");
      }

      function markStep(n) {
        for (let i = 1; i <= 3; i++) {
          const el = $("step" + i);
          el.classList.toggle("active", i === n);
          el.classList.toggle("done", i < n);
        }
      }

      async function refreshStatus() {
        if (!S.warrantId) return;
        const res = await fetch(
          `/api/status?warrant_id=${encodeURIComponent(S.warrantId)}`,
        );
        const data = await res.json();
        if (data.warrant) renderChain(data.warrant.state);
        if (data.audit) renderAudit(data.audit);
      }

      $("propose").onclick = async () => {
        const req = $("request").value.trim();
        if (!req) return alert("先填写请求");
        setBusy($("propose"), $("proposeSpin"), true);
        try {
          const d = await post("/api/propose", { request: req });
          $("proposal").hidden = false;
          $("beforeVal").textContent = d.current.answer;
          $("beforeMeta").textContent =
            `${d.current.type} · host ${d.current.host} · TTL ${d.current.ttl}`;
          $("afterVal").textContent = d.action.effect.answer;
          $("afterMeta").textContent =
            `${d.action.effect.type} · host ${d.action.effect.host} · TTL ${d.action.effect.ttl}`;
          $("reason").innerHTML = `<b>理由：</b>${d.reason}`;
          markStep(1);
        } catch (e) {
          alert("提案失败：" + e.message);
        } finally {
          setBusy($("propose"), $("proposeSpin"), false);
        }
      };

      $("issue").onclick = async () => {
        const req = $("request").value.trim();
        setBusy($("issue"), $("issueSpin"), true);
        try {
          const d = await post("/api/issue", { request: req });
          S.warrantId = d.warrant_id;
          S.envelopeId = d.envelope_id;
          $("signingLink").href = d.signing_url;
          $("signingLink").textContent = d.signing_url;
          $("signing").hidden = false;
          $("signingStatus").className = "pill warn";
          $("signingStatus").textContent = "等待签名…";
          pollSigning();
          refreshStatus();
          markStep(2);
        } catch (e) {
          alert("签发失败：" + e.message);
        } finally {
          setBusy($("issue"), $("issueSpin"), false);
        }
      };

      function pollSigning() {
        const timer = setInterval(async () => {
          if (!S.envelopeId) return;
          try {
            const res = await fetch(
              `/api/envelope/${encodeURIComponent(S.envelopeId)}/status`,
            );
            const d = await res.json();
            if (d.signed) {
              clearInterval(timer);
              $("signingStatus").className = "pill ok";
              $("signingStatus").textContent = "已签名，可以执行";
              if (!$("executeBtn")) {
                const row = document.createElement("div");
                row.className = "row";
                row.innerHTML =
                  '<button id="executeBtn">执行</button><span id="execSpin" class="spinner" hidden></span>';
                $("signing").appendChild(row);
                $("executeBtn").onclick = doExecute;
              }
            }
          } catch {}
        }, 3000);
      }

      async function doExecute() {
        setBusy($("executeBtn"), $("execSpin"), true);
        try {
          const d = await post("/api/execute", {
            warrant_id: S.warrantId,
            envelope_id: S.envelopeId,
          });
          lastResult = d;
          $("result").hidden = false;
          $("resultBody").textContent = JSON.stringify(d, null, 2);
          $("replayResult").innerHTML = "";
          await refreshStatus();
          markStep(3);
        } catch (e) {
          alert("执行失败：" + e.message);
        } finally {
          setBusy($("executeBtn"), $("execSpin"), false);
        }
      }

      $("download").onclick = () => {
        if (!lastResult) return;
        const blob = new Blob([JSON.stringify(lastResult, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `warrant-receipt-${S.warrantId}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      $("replay").onclick = async () => {
        if (!S.warrantId) return;
        try {
          const res = await fetch(
            `/api/replay?warrant_id=${encodeURIComponent(S.warrantId)}`,
          );
          const d = await res.json();
          const ok = d.ok === true;
          $("replayResult").innerHTML = ok
            ? '<span class="pill warn">意外：重放成功</span>'
            : `<span class="pill err">拒绝：${d.reason}</span>`;
        } catch (e) {
          $("replayResult").innerHTML =
            `<span class="pill err">${e.message}</span>`;
        }
      };

      async function loadDns() {
        try {
          const res = await fetch("/api/current");
          const d = await res.json();
          $("dnsStatus").textContent =
            `${d.host} ${d.type} → ${d.answer}（TTL ${d.ttl}）`;
        } catch {
          $("dnsStatus").textContent = "无法读取";
        }
      }

      loadDns();
    </script>
  </body>
</html>
